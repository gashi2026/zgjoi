name: Build and marketplace regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CHECKPOINT_DISABLE: "1"
      # This password belongs only to the disposable CI container, never Supabase.
      DATABASE_URL: postgresql://postgres:ci_only_password@127.0.0.1:5432/zgjoi_test
      DIRECT_URL: postgresql://postgres:ci_only_password@127.0.0.1:5432/zgjoi_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: zgjoi_test
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d zgjoi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/prepare-test-db.mjs
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - name: Rehearse disposable database backup and restore
        run: node scripts/rehearse-recovery.mjs
        env:
          PG_TEST_CONTAINER: ${{ job.services.postgres.id }}
      - run: npm run test:smoke
      - run: npm audit --omit=dev --audit-level=high
